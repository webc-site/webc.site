t1: WebC v2.0 שוחרר רשמית: ארכיטקטורת רכיבים מינימליסטית עבור האינטרנט המודרני
s1: |-
  לאחר חצי שנה של שחזור, WebC v2.0 הגיע רשמית. ארכיטקטורת **Light DOM** המעוצבת החדשה משולבת בצורה מושלמת עם `Custom Elements` מקורית כדי להביא לשיפורי ביצועים שאין שני להם.
t2: Native CSS Nesting תרגול מעמיק ואופטימיזציה של ביצועים
s2: |-
  כיום, עם דפדפנים מודרניים שתומכים באופן מלא ב`CSS Nesting` , השילוב של רמות קינון קדם-מעבד ותכונות מקוריות מפשט מאוד את עלויות התחזוקה בסגנון. מאמר זה בוחן את יתרונות הליבה ואת שיטות העבודה המומלצות שלו.
t3: פילוסופיית הבנייה של ספריית רכיבי ממשק משתמש אפס תלות
s3: |-
  חזור לערימת הטכנולוגיה המקורית באינטרנט: אין צורך בצינורות בנייה מורכבים ובעצי תלות עצומים, אתה יכול לבנות ממשקי משתמש בעלי ביצועים גבוהים עם JavaScript מקורי בלבד ותקני אינטרנט.
btn: לחץ כאן כדי לקרוא