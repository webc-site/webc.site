t1: WebC v2.0 ကိုတရားဝင်ထုတ်ပြန်ခဲ့သည်- ခေတ်မီဝဘ်အတွက် အနည်းငယ်မျှသာသော အစိတ်အပိုင်းဗိသုကာလက်ရာ
s1: |-
  ပြန်လည်တည်ဆောက်မှု နှစ်ဝက်အကြာတွင် WebC v2.0 သည် တရားဝင်ရောက်ရှိလာပါသည်။ အသစ်ဒီဇိုင်းထုတ်ထားသော **Light DOM** ဗိသုကာသည် မူရင်း `Custom Elements`နှင့် ယှဉ်တွဲ၍မရသော စွမ်းဆောင်ရည်ကို မြှင့်တင်ပေးပါသည်။
t2: မူရင်း CSS Nesting အတွင်းကျကျ အလေ့အကျင့်နှင့် စွမ်းဆောင်ရည် ပိုမိုကောင်းမွန်အောင် ပြုလုပ်ခြင်း။
s2: |-
  ယနေ့ခေတ်တွင်၊ ခေတ်မီဘရောက်ဆာများသည် `CSS Nesting`ကို အပြည့်အဝပံ့ပိုးပေးသဖြင့်၊ ပရိုဆက်ဆာ nesting အဆင့်များနှင့် မူရင်းအင်္ဂါရပ်များပေါင်းစပ်မှုသည် စတိုင်ထိန်းသိမ်းမှုကုန်ကျစရိတ်များကို များစွာရိုးရှင်းစေသည်။ ဤဆောင်းပါးသည် ၎င်း၏ အဓိကအကျိုးကျေးဇူးများနှင့် အကောင်းဆုံးအလေ့အကျင့်များကို စူးစမ်းလေ့လာထားသည်။
t3: zero-dependency UI အစိတ်အပိုင်းစာကြည့်တိုက်၏တည်ဆောက်မှုခံယူချက်
s3: |-
  ဝဘ်-ဇာတိနည်းပညာအစုသို့ ပြန်သွားရန်- ရှုပ်ထွေးသောတည်ဆောက်မှုပိုက်လိုင်းများနှင့် ကြီးမားသောမှီခိုမှုသစ်ပင်များမလိုအပ်ဘဲ မူရင်း JavaScript နှင့် ဝဘ်စံနှုန်းများသာဖြင့် စွမ်းဆောင်ရည်မြင့် UI များကို သင်တည်ဆောက်နိုင်သည်။
btn: ဖတ်ရန် ဤနေရာကိုနှိပ်ပါ။