t1: WebC v2.0 正式发布：面向现代 Web 的极简组件架构
s1: |-
  经过半年的重构，WebC v2.0 正式到来。全新设计的 **Light DOM** 架构与原生 `Custom Elements` 完美结合，带来无与伦比的性能提升。
t2: 原生 CSS Nesting 深度实践与性能优化
s2: |-
  在现代浏览器全面支持 `CSS Nesting` 的今天，预处理器的嵌套层级与原生特性的结合极大地简化了样式维护成本。本文探讨其核心优势与最佳实践。
t3: 零依赖 UI 组件库的构建哲学
s3: |-
  回归 Web 原生技术栈：无需复杂的构建流水线与庞大的依赖树，仅凭原生 JavaScript 与 Web Standards 即可构建高性能 UI。
