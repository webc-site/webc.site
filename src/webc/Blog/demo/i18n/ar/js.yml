t1: تم إصدار WebC v2.0 رسميًا: بنية المكونات البسيطة للويب الحديث
s1: |-
  بعد نصف عام من إعادة البناء، وصل WebC v2.0 رسميًا. تم دمج بنية **Light DOM** المصممة حديثًا بشكل مثالي مع `Custom Elements` الأصلي لتحقيق تحسينات لا مثيل لها في الأداء.
t2: ممارسة متعمقة لتداخل CSS الأصلي وتحسين الأداء
s2: |-
  اليوم، مع دعم المتصفحات الحديثة `CSS Nesting` بشكل كامل، فإن الجمع بين مستويات تداخل المعالج المسبق والميزات الأصلية يبسط إلى حد كبير تكاليف صيانة النمط. تستكشف هذه المقالة فوائدها الأساسية وأفضل الممارسات.
t3: فلسفة بناء مكتبة مكونات واجهة المستخدم ذات التبعية الصفرية
s3: |-
  العودة إلى حزمة التكنولوجيا الأصلية للويب: لا حاجة لخطوط بناء معقدة وأشجار تبعية ضخمة، يمكنك إنشاء واجهات مستخدم عالية الأداء باستخدام JavaScript ومعايير الويب الأصلية فقط.
btn: انقر هنا للقراءة