t1: WebC v2.0 официјално објавен: минималистичка архитектура на компоненти за модерната мрежа
s1: |-
  По половина година реконструкција, WebC v2.0 официјално пристигна. Новодизајнираната архитектура **Light DOM** е совршено комбинирана со мајчин `Custom Elements` за да донесе неспоредливи подобрувања во перформансите.
t2: Продлабочена пракса и оптимизација на перформансите на Native CSS Nesting
s2: |-
  Денес, со модерните прелистувачи кои целосно го поддржуваат `CSS Nesting`, комбинацијата на нивоа на вгнездување на предпроцесор и природни карактеристики значително ги поедноставува трошоците за одржување на стилот. Оваа статија ги истражува нејзините основни придобивки и најдобри практики.
t3: Конструктивна филозофија на библиотека со компонента на UI со нулта зависност
s3: |-
  Вратете се во магацинот на веб-мајчин технологија: Нема потреба од сложени цевководи за градење и огромни стебла на зависност, можете да изградите интерфејси со високи перформанси само со мајчин JavaScript и веб стандарди.
