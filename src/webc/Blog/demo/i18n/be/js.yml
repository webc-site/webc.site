t1: Афіцыйна выпушчаны WebC v2.0: мінімалістычная архітэктура кампанентаў для сучаснага Інтэрнэту
s1: |-
  Пасля паўгода рэканструкцыі WebC v2.0 афіцыйна прыбыў. Нядаўна распрацаваная архітэктура **Light DOM** ідэальна спалучаецца з уласным `Custom Elements`, каб прынесці беспрэцэдэнтныя паляпшэнні прадукцыйнасці.
t2: Паглыбленая практыка Native CSS Nesting і аптымізацыя прадукцыйнасці
s2: |-
  Сёння з сучаснымі браўзерамі, якія цалкам падтрымліваюць `CSS Nesting`, спалучэнне ўзроўняў укладзеных прэпрацэсараў і ўласных функцый значна спрашчае выдаткі на абслугоўванне стылю. У гэтым артыкуле разглядаюцца яго асноўныя перавагі і лепшыя практыкі.
t3: Філасофія пабудовы бібліятэкі кампанентаў карыстацкага інтэрфейсу без залежнасці
s3: |-
  Вяртанне да стэка ўласных вэб-тэхналогій: няма неабходнасці ў складаных канвеерах зборкі і вялізных дрэвах залежнасцяў, вы можаце ствараць высокапрадукцыйныя інтэрфейсы толькі з уласным JavaScript і вэб-стандартамі.
btn: Націсніце тут, каб прачытаць