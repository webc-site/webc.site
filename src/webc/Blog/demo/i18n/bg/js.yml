t1: Официално пуснат WebC v2.0: минималистична компонентна архитектура за съвременната мрежа
s1: |-
  След половин година реконструкция, WebC v2.0 официално пристигна. Новопроектираната **Light DOM** архитектура е идеално комбинирана с оригиналния `Custom Elements`, за да донесе несравними подобрения в производителността.
t2: Задълбочена практика за вмъкване на собствен CSS и оптимизиране на производителността
s2: |-
  Днес, с модерните браузъри, които напълно поддържат `CSS Nesting`, комбинацията от нива на влагане на предпроцесора и естествени функции значително опростява разходите за поддръжка на стила. Тази статия изследва неговите основни предимства и най-добри практики.
t3: Философията на конструиране на библиотека с компоненти на потребителския интерфейс с нулева зависимост
s3: |-
  Върнете се към набора от собствени уеб технологии: Няма нужда от сложни конвейери за изграждане и огромни дървета на зависимости, можете да изградите високопроизводителни потребителски интерфейси само с естествен JavaScript и уеб стандарти.
btn: Щракнете тук, за да прочетете