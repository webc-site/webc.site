t1: Офіційно випущено WebC v2.0: мінімалістична архітектура компонентів для сучасного Інтернету
s1: |-
  Після півроку реконструкції WebC v2.0 офіційно надійшов. Нова розроблена архітектура **Light DOM** ідеально поєднується з рідною `Custom Elements`, щоб забезпечити неперевершене підвищення продуктивності.
t2: Поглиблена практика Native CSS Nesting і оптимізація продуктивності
s2: |-
  Сьогодні, коли сучасні браузери повністю підтримують `CSS Nesting`, поєднання рівнів вкладеності препроцесора та власних функцій значно спрощує витрати на підтримку стилю. У цій статті розглядаються його основні переваги та найкращі практики.
t3: Філософія побудови бібліотеки компонентів інтерфейсу користувача з нульовою залежністю
s3: |-
  Повернення до стеку веб-технологій: не потрібні складні конвеєри побудови та величезні дерева залежностей, ви можете створювати високопродуктивні інтерфейси користувача лише за допомогою рідного JavaScript і веб-стандартів.
