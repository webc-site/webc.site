t1: WebC v2.0 正式發布：面向現代 Web 的極簡元件架構
s1: |-
  經過半年的重構，WebC v2.0 正式到來。全新設計的 **Light DOM** 架構與原生 `Custom Elements` 完美結合，帶來無與倫比的效能提升。
t2: 原生 CSS Nesting 深度實踐與效能優化
s2: |-
  在現代瀏覽器全面支援 `CSS Nesting` 的今天，預處理器的嵌套層級與原生特性的結合極大地簡化了樣式維護成本。本文探討其核心優勢與最佳實務。
t3: 零依賴 UI 元件庫的建構哲學
s3: |-
  回歸 Web 原生技術堆疊：無需複雜的建置管線與龐大的依賴樹，僅憑原生 JavaScript 與 Web Standards 即可建置高效能 UI。
