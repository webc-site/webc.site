t1: WebC v2.0 باضابطہ طور پر جاری کیا گیا: جدید ویب کے لیے کم سے کم جزو فن تعمیر
s1: |-
  تعمیر نو کے آدھے سال کے بعد، WebC v2.0 باضابطہ طور پر آ گیا ہے۔ کارکردگی میں بے مثال بہتری لانے کے لیے نئے ڈیزائن کردہ **Light DOM** فن تعمیر کو مقامی `Custom Elements` کے ساتھ بالکل ملایا گیا ہے۔
t2: مقامی CSS نیسٹنگ میں گہرائی سے مشق اور کارکردگی کی اصلاح
s2: |-
  آج، جدید براؤزرز مکمل طور پر `CSS Nesting` کو سپورٹ کر رہے ہیں، پری پروسیسر نیسٹنگ لیولز اور مقامی خصوصیات کا امتزاج انداز کی دیکھ بھال کے اخراجات کو بہت آسان بنا دیتا ہے۔ یہ مضمون اس کے بنیادی فوائد اور بہترین طریقوں کو دریافت کرتا ہے۔
t3: زیرو-انحصار UI جزو لائبریری کا تعمیراتی فلسفہ
s3: |-
  ویب-مقامی ٹیکنالوجی اسٹیک پر واپس جائیں: پیچیدہ تعمیراتی پائپ لائنوں اور بڑے انحصار والے درختوں کی ضرورت نہیں، آپ صرف مقامی JavaScript اور ویب معیارات کے ساتھ اعلیٰ کارکردگی والے UIs بنا سکتے ہیں۔
btn: پڑھنے کے لیے یہاں کلک کریں۔