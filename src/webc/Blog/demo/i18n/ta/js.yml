t1: WebC v2.0 அதிகாரப்பூர்வமாக வெளியிடப்பட்டது: நவீன இணையத்திற்கான குறைந்தபட்ச கூறு கட்டமைப்பு
s1: |-
  அரை வருட புனரமைப்புக்குப் பிறகு, WebC v2.0 அதிகாரப்பூர்வமாக வந்துவிட்டது. புதிதாக வடிவமைக்கப்பட்ட **லைட் DOM** கட்டமைப்பானது, நிகரற்ற செயல்திறன் மேம்பாடுகளைக் கொண்டு வர, சொந்த `Custom Elements` உடன் முழுமையாக இணைக்கப்பட்டுள்ளது.
t2: நேட்டிவ் CSS நெஸ்டிங் ஆழ்ந்த பயிற்சி மற்றும் செயல்திறன் மேம்படுத்தல்
s2: |-
  இன்று, நவீன உலாவிகள் `CSS Nesting` ஐ முழுமையாக ஆதரிக்கும் நிலையில், முன்செயலி கூடு கட்டும் நிலைகள் மற்றும் சொந்த அம்சங்களின் கலவையானது நடை பராமரிப்பு செலவுகளை பெரிதும் எளிதாக்குகிறது. இந்த கட்டுரை அதன் முக்கிய நன்மைகள் மற்றும் சிறந்த நடைமுறைகளை ஆராய்கிறது.
t3: பூஜ்ஜிய-சார்பு UI கூறு நூலகத்தின் கட்டுமானத் தத்துவம்
s3: |-
  வலை-நேட்டிவ் டெக்னாலஜி ஸ்டேக்கிற்குத் திரும்பு: சிக்கலான பைப்லைன்கள் மற்றும் பெரிய சார்பு மரங்கள் தேவையில்லை, சொந்த ஜாவாஸ்கிரிப்ட் மற்றும் வெப் ஸ்டாண்டர்டுகளை மட்டுமே கொண்டு உயர் செயல்திறன் UIகளை உருவாக்க முடியும்.
btn: படிக்க இங்கே கிளிக் செய்யவும்