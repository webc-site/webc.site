t1: WebC v2.0 ресми түрде шығарылды: заманауи веб үшін минималистік құрамдас архитектура
s1: |-
  Жарты жылдық қайта құрудан кейін WebC v2.0 ресми түрде келді. Жаңадан жасалған **Light DOM** архитектурасы өнімділікті теңдесі жоқ жақсартулар үшін жергілікті `Custom Elements` бағдарламасымен тамаша үйлеседі.
t2: Native CSS Nesting терең тәжірибе және өнімділікті оңтайландыру
s2: |-
  Бүгінгі таңда `CSS Nesting` толықтай қолдайтын заманауи браузерлермен, препроцессордың кірістіру деңгейлері мен жергілікті мүмкіндіктердің үйлесімі стильді ұстау шығындарын айтарлықтай жеңілдетеді. Бұл мақалада оның негізгі артықшылықтары мен ең жақсы тәжірибелері қарастырылады.
t3: Нөлдік тәуелділік UI құрамдас кітапханасының құрылыс философиясы
s3: |-
  Веб-негізгі технологиялар стекіне оралыңыз: күрделі құрастыру құбырлары мен үлкен тәуелділік ағаштарының қажеті жоқ, тек жергілікті JavaScript және веб стандарттары арқылы жоғары өнімді UI құра аласыз.
btn: Оқу үшін осы жерді басыңыз