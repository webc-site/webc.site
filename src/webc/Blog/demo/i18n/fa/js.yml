t1: WebC v2.0 رسما منتشر شد: معماری اجزای مینیمالیستی برای وب مدرن
s1: |-
  پس از نیم سال بازسازی، WebC v2.0 رسما وارد بازار شد. معماری **Light DOM** جدید طراحی شده کاملاً با `Custom Elements` بومی ترکیب شده است تا عملکرد بی نظیری را بهبود ببخشد.
t2: Native CSS Nesting تمرین عمیق و بهینه سازی عملکرد
s2: |-
  امروزه، با مرورگرهای مدرنی که به طور کامل `CSS Nesting` را پشتیبانی می کنند، ترکیب سطوح تودرتوی پیش پردازنده و ویژگی های بومی هزینه های نگهداری سبک را بسیار ساده می کند. این مقاله مزایای اصلی و بهترین شیوه های آن را بررسی می کند.
t3: فلسفه ساخت کتابخانه مؤلفه UI با وابستگی صفر
s3: |-
  بازگشت به پشته فناوری بومی وب: بدون نیاز به خطوط لوله ساخت پیچیده و درخت‌های وابستگی بزرگ، می‌توانید رابط‌های کاربری با کارایی بالا را تنها با جاوا اسکریپت بومی و استانداردهای وب بسازید.
btn: برای مطالعه اینجا کلیک کنید