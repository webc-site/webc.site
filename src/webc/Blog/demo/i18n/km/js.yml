t1: WebC v2.0 បានចេញផ្សាយជាផ្លូវការ៖ ស្ថាបត្យកម្មសមាសធាតុតិចតួចបំផុតសម្រាប់គេហទំព័រទំនើប
s1: |-
  បន្ទាប់ពីពាក់កណ្តាលឆ្នាំនៃការកសាងឡើងវិញ WebC v2.0 បានមកដល់ជាផ្លូវការ។ ស្ថាបត្យកម្ម **Light DOM** ដែលរចនាថ្មីត្រូវបានរួមបញ្ចូលគ្នាយ៉ាងល្អឥតខ្ចោះជាមួយ `Custom Elements`ដើម ដើម្បីនាំមកនូវការកែលម្អការអនុវត្តដែលមិនអាចប្រៀបផ្ទឹមបាន។
t2: CSS ដើម ការអនុវត្តស៊ីជម្រៅ និងការបង្កើនប្រសិទ្ធភាពការអនុវត្ត
s2: |-
  សព្វថ្ងៃនេះ ជាមួយនឹងកម្មវិធីរុករកតាមអ៊ីនធឺណិតទំនើបដែលគាំទ្រយ៉ាងពេញទំហឹង `CSS Nesting` ការរួមបញ្ចូលគ្នានៃកម្រិតនៃការដាក់បញ្ចូលរបស់ឧបករណ៍ដំណើរការមុន និងមុខងារដើមជួយសម្រួលដល់ការចំណាយលើការថែទាំរចនាប័ទ្មយ៉ាងខ្លាំង។ អត្ថបទនេះស្វែងយល់ពីអត្ថប្រយោជន៍ស្នូល និងការអនុវត្តល្អបំផុតរបស់វា។
t3: ទស្សនវិជ្ជានៃការសាងសង់បណ្ណាល័យសមាសភាគ UI អាស្រ័យសូន្យ
s3: |-
  ត្រឡប់ទៅជង់បច្ចេកវិទ្យាដើមនៃគេហទំព័រវិញ៖ មិនចាំបាច់មានបំពង់បង្ហូរប្រេងដែលស្មុគស្មាញ និងដើមឈើអាស្រ័យដ៏ធំនោះទេ អ្នកអាចបង្កើត UI ដែលមានប្រសិទ្ធភាពខ្ពស់ដោយប្រើតែ JavaScript និងស្តង់ដារគេហទំព័រដើមប៉ុណ្ណោះ។
btn: ចុចទីនេះដើម្បីអាន