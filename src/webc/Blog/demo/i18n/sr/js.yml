t1: ВебЦ в2.0 званично објављен: минималистичка архитектура компоненти за савремени веб
s1: |-
  После пола године реконструкције, ВебЦ в2.0 је званично стигао. Новодизајнирана **Лигхт ДОМ** архитектура је савршено комбинована са изворним <б ид="1"> да би донела неупоредива побољшања перформанси.
t2: Детаљна пракса угнежђења изворног ЦСС-а и оптимизација перформанси
s2: |-
  Данас, са модерним претраживачима који у потпуности подржавају <б ид="1"> , комбинација нивоа угнежђења предпроцесора и изворних функција у великој мери поједностављује трошкове одржавања стила. Овај чланак истражује његове основне предности и најбоље праксе.
t3: Филозофија конструкције библиотеке компоненти корисничког интерфејса са нултом зависношћу
s3: |-
  Вратите се на стек технологије која је изворна за веб: Нема потребе за сложеним цевоводима изградње и огромним стаблима зависности, можете да направите корисничке интерфејсе високих перформанси само са изворним ЈаваСцрипт-ом и веб стандардима.
