t1: WebC v2.0 ເປີດຕົວຢ່າງເປັນທາງການ: ສະຖາປັດຕະຍະກໍາອົງປະກອບທີ່ນ້ອຍທີ່ສຸດສໍາລັບເວັບທີ່ທັນສະໄຫມ
s1: |-
  ຫຼັງຈາກເຄິ່ງປີຂອງການກໍ່ສ້າງຄືນໃຫມ່, WebC v2.0 ໄດ້ມາຮອດຢ່າງເປັນທາງການ. ສະຖາປັດຕະຍະກຳ **Light DOM** ທີ່ອອກແບບໃໝ່ຖືກລວມເຂົ້າກັນຢ່າງສົມບູນແບບກັບ `Custom Elements`ພື້ນເມືອງເພື່ອນຳເອົາການປັບປຸງປະສິດທິພາບທີ່ບໍ່ເຄີຍມີມາກ່ອນ.
t2: Native CSS Nesting in-depth practice and performance optimization
s2: |-
  ໃນມື້ນີ້, ດ້ວຍຕົວທ່ອງເວັບທີ່ທັນສະໄຫມສະຫນັບສະຫນູນຢ່າງເຕັມສ່ວນ `CSS Nesting` , ການປະສົມປະສານຂອງ preprocessor nesting ລະດັບແລະຄຸນສົມບັດພື້ນເມືອງໄດ້ງ່າຍຂຶ້ນຢ່າງຫຼວງຫຼາຍຄ່າໃຊ້ຈ່າຍໃນການບໍາລຸງຮັກສາຮູບແບບ. ບົດຄວາມນີ້ສໍາຫຼວດຜົນປະໂຫຍດຫຼັກຂອງມັນ ແລະການປະຕິບັດທີ່ດີທີ່ສຸດ.
t3: ປັດຊະຍາການກໍ່ສ້າງຂອງຫ້ອງສະໝຸດອົງປະກອບ UI ທີ່ບໍ່ຂຶ້ນກັບສູນ
s3: |-
  ກັບຄືນສູ່ສະເຕກເທັກໂນໂລຍີພື້ນເມືອງຂອງເວັບ: ບໍ່ຈໍາເປັນຕ້ອງມີທໍ່ສ້າງທີ່ສັບສົນ ແລະຕົ້ນໄມ້ທີ່ເພິ່ງພາອາໄສອັນໃຫຍ່ຫຼວງ, ທ່ານສາມາດສ້າງ UI ທີ່ມີປະສິດຕິພາບສູງໄດ້ໂດຍມີພຽງແຕ່ JavaScript ແລະມາດຕະຖານເວັບເທົ່ານັ້ນ.
btn: ຄລິກທີ່ນີ້ເພື່ອອ່ານ