t1: WebC v2.0 正式リリース: 最新の Web 向けの最小限のコンポーネント アーキテクチャ
s1: |-
  半年間の再構築を経て、WebC v2.0 が正式に登場しました。新しく設計された **Light DOM** アーキテクチャは、ネイティブ`Custom Elements`と完全に組み合わされて、比類のないパフォーマンスの向上をもたらします。
t2: ネイティブ CSS ネスティングの詳細な実践とパフォーマンスの最適化
s2: |-
  現在、最新のブラウザは `CSS Nesting` を完全にサポートしているため、プリプロセッサのネスト レベルとネイティブ機能の組み合わせにより、スタイルのメンテナンス コストが大幅に簡素化されます。この記事では、その主要な利点とベスト プラクティスについて説明します。
t3: 依存関係ゼロのUIコンポーネントライブラリの構築理念
s3: |-
  Web ネイティブ テクノロジ スタックに戻る: 複雑なビルド パイプラインや巨大な依存関係ツリーは必要なく、ネイティブ JavaScript と Web 標準のみを使用して高性能 UI を構築できます。
