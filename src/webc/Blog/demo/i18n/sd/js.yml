t1: WebC v2.0 سرڪاري طور تي جاري ڪيو ويو: جديد ويب لاءِ minimalist جزو فن تعمير
s1: |-
  تعمير جي اڌ سال کان پوء، WebC v2.0 سرڪاري طور تي اچي چڪو آهي. نئين ڊزائين ڪيل **لائيٽ ڊوم** آرڪيٽيڪچر کي مڪمل طور تي مقامي `Custom Elements` سان گڏ ڪيو ويو آهي ته جيئن بي مثال ڪارڪردگي بهتري آڻي سگهجي.
t2: اصلي CSS Nesting ۾ گہرا مشق ۽ ڪارڪردگي جي اصلاح
s2: |-
  اڄ، جديد برائوزرن سان مڪمل طور تي سپورٽ ڪري رهيا آهن `CSS Nesting`، پري پروسيسر نيسٽنگ جي سطحن ۽ اصلي خاصيتن جو ميلاپ انداز جي سار سنڀال جي خرچن کي تمام گهڻو آسان بڻائي ٿو. هي آرٽيڪل ان جي بنيادي فائدن ۽ بهترين عملن کي ڳولي ٿو.
t3: زيرو-انحصار UI جزو لائبريري جو تعميراتي فلسفو
s3: |-
  ويب-مقامي ٽيڪنالاجي اسٽيڪ ڏانھن واپس وڃو: پيچيده تعمير پائپ لائنز ۽ وڏي انحصار واري وڻن جي ڪا ضرورت ناهي، توھان ٺاھي سگھوٿا اعلي ڪارڪردگي UIs صرف اصلي JavaScript ۽ ويب معيارن سان.
btn: پڙهڻ لاءِ هتي ڪلڪ ڪريو