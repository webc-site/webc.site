t1: WebC v2.0 iliyotolewa rasmi: usanifu wa sehemu ndogo kwa wavuti wa kisasa
s1: |-
  Baada ya nusu mwaka wa ujenzi upya, WebC v2.0 imewasili rasmi. Usanifu mpya ulioundwa wa **Nyepesi wa DOM** umeunganishwa kikamilifu na asili `Custom Elements` ili kuleta maboresho ya utendaji yasiyo na kifani.
t2: Mazoezi ya kina ya Nesting ya CSS na uboreshaji wa utendaji
s2: |-
  Leo, vivinjari vya kisasa vinavyotumia kikamilifu `CSS Nesting` , mchanganyiko wa viwango vya kutayarisha viota na vipengele asili hurahisisha sana gharama za urekebishaji wa mtindo. Makala haya yanachunguza manufaa yake ya msingi na mbinu bora.
t3: Falsafa ya ujenzi ya maktaba ya sehemu ya UI isiyotegemea sifuri
s3: |-
  Rudi kwenye rundo la teknolojia ya asili ya wavuti: Hakuna haja ya mabomba changamano ya ujenzi na miti mikubwa tegemezi, unaweza kuunda violesura vya utendaji wa juu ukitumia JavaScript asilia na Viwango vya Wavuti pekee.
btn: Bofya hapa kusoma