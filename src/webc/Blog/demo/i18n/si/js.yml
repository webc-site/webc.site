t1: WebC v2.0 නිල වශයෙන් නිකුත් කරන ලදී: නවීන වෙබ් සඳහා අවම සංරචක ගෘහ නිර්මාණ ශිල්පය
s1: |-
  ප්‍රතිසංස්කරණයෙන් වසර භාගයකට පසු, WebC v2.0 නිල වශයෙන් පැමිණ ඇත. අසමසම කාර්ය සාධන වැඩිදියුණු කිරීම් ගෙන ඒම සඳහා අලුතින් නිර්මාණය කරන ලද **Light DOM** ගෘහ නිර්මාණ ශිල්පය ස්වදේශීය `Custom Elements` සමඟ පරිපූර්ණ ලෙස ඒකාබද්ධ කර ඇත.
t2: දේශීය CSS කැදලි ගැඹුරු පුහුණුව සහ කාර්ය සාධන ප්‍රශස්තකරණය
s2: |-
  අද, නවීන බ්‍රවුසරයන් `CSS Nesting` ට සම්පුර්ණයෙන්ම සහය දක්වයි, පෙර සකසන ලද කැදලි මට්ටම් සහ ස්වදේශීය විශේෂාංග වල එකතුව විලාස නඩත්තු පිරිවැය බෙහෙවින් සරල කරයි. මෙම ලිපිය එහි මූලික ප්‍රතිලාභ සහ හොඳම භාවිතයන් ගවේෂණය කරයි.
t3: ශුන්‍ය යැපුම් UI සංරචක පුස්තකාලයේ ඉදිකිරීම් දර්ශනය
s3: |-
  වෙබ්-ස්වදේශීය තාක්‍ෂණ තොගයට ආපසු යන්න: සංකීර්ණ ගොඩනැගීමේ නල මාර්ග සහ විශාල පරායත්ත ගස් අවශ්‍ය නොවේ, ඔබට ස්වදේශීය ජාවාස්ක්‍රිප්ට් සහ වෙබ් ප්‍රමිති සමඟ පමණක් ඉහළ ක්‍රියාකාරී යූඅයි සෑදිය හැකිය.
btn: කියවීමට මෙතන ක්ලික් කරන්න