t1: Официально выпущен WebC v2.0: минималистская архитектура компонентов для современного Интернета
s1: |-
  После полугода реконструкции официально появился WebC v2.0. Недавно разработанная архитектура **Light DOM** прекрасно сочетается с собственным `Custom Elements`, обеспечивая беспрецедентное повышение производительности.
t2: Углубленная практика вложения CSS и оптимизация производительности
s2: |-
  Сегодня, когда современные браузеры полностью поддерживают `CSS Nesting` , сочетание уровней вложенности препроцессора и встроенных функций значительно упрощает затраты на поддержку стиля. В этой статье рассматриваются его основные преимущества и лучшие практики.
t3: Философия построения библиотеки компонентов пользовательского интерфейса с нулевой зависимостью.
s3: |-
  Вернитесь к стеку веб-технологий: нет необходимости в сложных конвейерах сборки и огромных деревьях зависимостей, вы можете создавать высокопроизводительные пользовательские интерфейсы, используя только собственный JavaScript и веб-стандарты.
