t1: Κυκλοφόρησε επίσημα το WebC v2.0: μινιμαλιστική αρχιτεκτονική στοιχείων για το σύγχρονο web
s1: |-
  Μετά από μισό χρόνο ανακατασκευής, το WebC v2.0 έφτασε επίσημα. Η πρόσφατα σχεδιασμένη αρχιτεκτονική **Light DOM** συνδυάζεται τέλεια με το εγγενές `Custom Elements` για να προσφέρει απαράμιλλες βελτιώσεις απόδοσης.
t2: Native CSS Nesting σε βάθος πρακτική και βελτιστοποίηση απόδοσης
s2: |-
  Σήμερα, με τα σύγχρονα προγράμματα περιήγησης που υποστηρίζουν πλήρως το `CSS Nesting` , ο συνδυασμός επιπέδων ένθεσης προεπεξεργαστή και εγγενών χαρακτηριστικών απλοποιεί σημαντικά το κόστος συντήρησης στυλ. Αυτό το άρθρο διερευνά τα βασικά οφέλη και τις βέλτιστες πρακτικές του.
t3: Η φιλοσοφία κατασκευής της βιβλιοθήκης στοιχείων διεπαφής χρήστη μηδενικής εξάρτησης
s3: |-
  Επιστρέψτε στη στοίβα τεχνολογίας εγγενούς ιστού: Δεν χρειάζεστε σύνθετες αγωγούς κατασκευής και τεράστια δέντρα εξάρτησης, μπορείτε να δημιουργήσετε UI υψηλής απόδοσης μόνο με εγγενή JavaScript και Πρότυπα Ιστού.
